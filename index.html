const SQLSB=`create table if not exists public.slb_cloud (
  code text primary key,
  v bigint not null default 1,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.slb_cloud enable row level security;
-- Aucune policy : la table n'est pas accessible directement.

create or replace function public.slb_get(p_code text)
returns jsonb language sql security definer set search_path = public as $$
  select jsonb_build_object('v', v, 'data', data, 'updated_at', updated_at)
  from public.slb_cloud where code = p_code;
$$;

create or replace function public.slb_put(p_code text, p_data jsonb, p_base bigint)
returns jsonb language plpgsql security definer set search_path = public as $$
declare cur bigint;
begin
  if p_code is null or length(p_code) < 8 then
    return jsonb_build_object('ok', false, 'error', 'code_court');
  end if;
  select v into cur from public.slb_cloud where code = p_code for update;
  if not found then
    insert into public.slb_cloud(code, v, data) values (p_code, 1, p_data);
    return jsonb_build_object('ok', true, 'v', 1);
  end if;
  if cur <> p_base then
    return jsonb_build_object('ok', false, 'error', 'conflict', 'v', cur);
  end if;
  update public.slb_cloud set v = cur + 1, data = p_data, updated_at = now() where code = p_code;
  return jsonb_build_object('ok', true, 'v', cur + 1);
end;
$$;

revoke all on function public.slb_get(text) from public;
revoke all on function public.slb_put(text, jsonb, bigint) from public;
grant execute on function public.slb_get(text) to anon, authenticated;
grant execute on function public.slb_put(text, jsonb, bigint) to anon, authenticated;`;
